[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apah"
version = "0.5.0"
description = "Custom LLM inference runtime & Ollama-styled CLI for NVIDIA GPUs"
authors = [{ name = "Apah Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "accelerate>=0.26.0",
    "safetensors>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sse-starlette>=1.6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
apah = "apah.cli.main:app"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["apah*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

